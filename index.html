<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Patsy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F1F2EC; --surface:#FFFFFF; --surface-2:#E7E9E0; --line:#D9DCD1;
  --ink:#1C221E; --ink-2:#5A625C; --ink-3:#8C938D;
  --accent:#B4235A; --accent-ink:#FFFFFF; --accent-soft:#F6DDE6;
  --inc:#237A4B; --warn:#C0392B; --ok:#237A4B; --mid:#C9821A;
  --hero:#1C221E; --hero-ink:#F1F2EC;
  --shadow:0 1px 2px rgba(28,34,30,.06),0 8px 24px rgba(28,34,30,.06);
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121513; --surface:#1B1F1C; --surface-2:#262B27; --line:#313732;
  --ink:#EEF1EC; --ink-2:#A9B0AA; --ink-3:#737B75;
  --accent:#F0679A; --accent-ink:#1B0A11; --accent-soft:#3A1D29;
  --inc:#6FD39B; --warn:#FF7B6B; --ok:#6FD39B; --mid:#F2B45A;
  --hero:#242A26; --hero-ink:#EEF1EC;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:999px;padding:3px}
.mode button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.period{display:flex;align-items:center;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.period button{border:0;background:none;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;color:var(--ink-2)}
.period span{min-width:112px;text-align:center;font-weight:600;font-size:13.5px}

.status{font-size:12px;color:var(--ink-3);margin:0 0 10px;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.status.ok::before{background:var(--ok)}
.status.local::before{background:var(--mid)}
.status.err::before{background:var(--warn)}

section[data-view]{display:flex;flex-direction:column;gap:18px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600;margin:0 0 8px}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:0}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hero .lbl{font-size:13px;opacity:.72}
.hero .big{font-family:var(--display);font-weight:500;font-size:clamp(28px,8.6vw,38px);letter-spacing:-.03em;line-height:1.05;margin-top:4px}
.hero .big small{font-size:.55em;opacity:.6;margin-left:4px}
.hero .big.over{color:#FF8A7A}
.meter{height:10px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--hero-ink);opacity:.55}
.hero .sub{display:flex;justify-content:space-between;gap:8px;font-size:13px;opacity:.85;flex-wrap:wrap}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.flow div{display:flex;flex-direction:column;gap:2px;min-width:0}
.flow span{font-size:12px;opacity:.65}
.flow b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .cta{align-self:flex-start;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:9px 14px;font-weight:600;font-size:14px}

.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.acc{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.acc span{font-size:13px;color:var(--ink-2)}
.acc b{font-size:17px;font-weight:600}
.neg{color:var(--warn)}

.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;border:0;background:none;text-align:left;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.dot{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.tx .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.tx .mid b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid span{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:600;white-space:nowrap}
.amt.inc{color:var(--inc)}
.amt.tr{color:var(--ink-2)}
.day{font-size:13px;color:var(--ink-2);font-weight:500;margin:4px 4px 6px;display:flex;justify-content:space-between}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.blist{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:6px 14px}
.brow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.brow .t span:last-child{color:var(--ink-2);white-space:nowrap}
.bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip .x{border:0;background:none;padding:0 0 0 2px;color:var(--ink-3);font-size:17px;line-height:1}

.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:148px;height:148px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{font-size:16px;font-weight:600;display:block}
.donut .c span{font-size:12px;color:var(--ink-3)}
.legend{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:14px}
.lg .sw{width:10px;height:10px;border-radius:3px}
.lg em{font-style:normal;color:var(--ink-3);font-size:12px;margin-left:4px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:170px;align-items:end}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;border:0;background:none;padding:0}
.bcol .pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;position:relative}
.bcol .b{width:36%;max-width:18px;border-radius:5px 5px 2px 2px;min-height:2px}
.b.i{background:var(--inc)} .b.e{background:var(--accent)}
.bcol span{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.bcol[aria-current="true"] span{color:var(--ink);font-weight:600}
.limit-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-3)}
.keys{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:10px;flex-wrap:wrap}
.keys i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;min-width:0}
textarea.inp{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.set-row{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;align-items:center}
.lim-row{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;font-size:14px}
.lim-row span{display:flex;align-items:center;gap:8px;min-width:0}
.lim-row .sw{width:9px;height:9px;border-radius:50%;flex:none}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink-2);font-size:18px;line-height:1}
.icon-btn:disabled{opacity:.35}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:none;color:var(--warn);border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:12.5px;color:var(--ink-3)}
.addrow{display:flex;gap:8px}
.addrow .inp{flex:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:3px}
.seg.two-col{grid-template-columns:1fr 1fr}
.seg button{border:0;background:none;border-radius:9px;padding:8px 0;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 20px rgba(180,35,90,.35);z-index:6}
.fab:disabled{opacity:.4}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-3);font-weight:500}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:var(--accent)}

.backdrop{position:fixed;inset:0;background:rgba(10,12,11,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:4px}
.amount:focus-within{border-color:var(--accent)}
.amount input{border:0;background:none;font-family:var(--display);font-weight:500;font-size:34px;width:100%;min-width:0;padding:0;outline:none;letter-spacing:-.02em}
.amount span{font-family:var(--display);font-size:24px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--warn);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">patsy<i>.</i></div>
    <div class="nav">
      <div class="mode" role="group" aria-label="Период">
        <button data-mode="week" aria-pressed="false">Неделя</button>
        <button data-mode="month" aria-pressed="true">Месяц</button>
      </div>
      <div class="period" role="group" aria-label="Выбор периода">
        <button id="pPrev" aria-label="Назад">‹</button>
        <span id="pLabel" class="num">—</span>
        <button id="pNext" aria-label="Вперёд">›</button>
      </div>
    </div>
  </header>
  <div class="status" id="status">Загрузка…</div>

  <section data-view="home" id="v-home"></section>
  <section data-view="ops" id="v-ops" hidden></section>
  <section data-view="stats" id="v-stats" hidden></section>
  <section data-view="settings" id="v-settings" hidden></section>
</div>

<button class="fab" id="fab" aria-label="Добавить операцию" disabled>+</button>

<nav class="tabs" aria-label="Разделы"><div>
  <button data-tab="home" aria-current="true"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button data-tab="ops"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Операции</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Статистика</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Настройки</button>
</div></nav>

<div class="backdrop" id="sheetWrap" hidden>
  <form class="sheet" id="txForm" autocomplete="off">
    <div class="grab"></div>
    <div class="seg" id="typeSeg" role="group" aria-label="Тип операции">
      <button type="button" data-type="exp" aria-pressed="true">Расход</button>
      <button type="button" data-type="inc" aria-pressed="false">Доход</button>
      <button type="button" data-type="tr" aria-pressed="false">Перевод</button>
    </div>
    <div class="amount"><input id="fAmount" inputmode="decimal" placeholder="0" aria-label="Сумма" class="num"><span>₽</span></div>
    <div class="field" id="catField"><label>Категория</label><div class="chips" id="fCats"></div></div>
    <div class="two">
      <div class="field"><label for="fAcc" id="accLbl">Счёт</label><select class="inp" id="fAcc"></select></div>
      <div class="field" id="toField" hidden><label for="fTo">На счёт</label><select class="inp" id="fTo"></select></div>
      <div class="field" id="dateField"><label for="fDate">Дата</label><input class="inp" type="date" id="fDate"></div>
    </div>
    <div class="field" id="dateField2" hidden><label for="fDate2">Дата</label><input class="inp" type="date" id="fDate2"></div>
    <div class="field"><label for="fNote">Комментарий</label><input class="inp" id="fNote" placeholder="Необязательно" maxlength="80"></div>
    <div class="err" id="fErr"></div>
    <div class="two">
      <button type="button" class="btn ghost" id="fCancel">Отмена</button>
      <button type="submit" class="btn" id="fSave">Добавить</button>
    </div>
    <button type="button" class="btn danger" id="fDel" hidden>Удалить операцию</button>
  </form>
</div>

<script>
(function(){
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayStr=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
let idc=0;const uid=()=>Date.now().toString(36)+(idc++%36).toString(36)+Math.random().toString(36).slice(2,4);
const _nfG=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2});
const _nfN=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2,useGrouping:false});
// по русской типографике 4-значные числа пишутся слитно (7400), разряды отделяются с 10 000
const nf={format:v=>(Math.abs(v)>=10000?_nfG:_nfN).format(v).replace(/\u2212/g,"-")};
const rub=(v,sign)=>{const s=nf.format(Math.abs(Math.round(v*100)/100));const p=sign?(v>0?"+":v<0?"-":""):(v<0?"-":"");return p+s+" ₽"};
const short=v=>{const a=Math.abs(v);if(a>=1e6)return (v/1e6).toFixed(1).replace(".",",")+" млн";if(a>=1e4)return Math.round(v/1e3)+" тыс";return nf.format(Math.round(v))};
const MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MGEN=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const MSH=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const PALETTE=["#B4235A","#2F6FB0","#D08A1E","#2E8B6A","#7A4CC2","#C4553B","#3C9AA8","#8A6B3D","#5B6B7A","#A83E8C","#4F8A2B","#9A9A2E"];
const parseAmount=s=>{const v=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isFinite(v)?Math.round(v*100)/100:NaN};

/* ================= periods ================= */
// anchor = first day of period (YYYY-MM-DD)
function periodStart(mode,dayStr){
  const d=pd(dayStr);
  if(mode==="month")return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-01";
  const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return ds(d);
}
function periodEnd(mode,start){ // exclusive
  if(mode==="week")return addDays(start,7);
  const d=pd(start);d.setMonth(d.getMonth()+1);return ds(d);
}
function shiftPeriod(mode,start,n){
  if(mode==="week")return addDays(start,7*n);
  const d=pd(start);d.setMonth(d.getMonth()+n);return ds(d);
}
function periodLabel(mode,start,compact){
  const d=pd(start);
  if(mode==="month")return compact?MSH[d.getMonth()]:cap(MONTHS[d.getMonth()])+" "+d.getFullYear();
  const e=pd(addDays(start,6));
  if(compact)return d.getDate()+"."+pad(d.getMonth()+1);
  return d.getMonth()===e.getMonth()?`${d.getDate()}–${e.getDate()} ${MGEN[e.getMonth()]}`:`${d.getDate()} ${MGEN[d.getMonth()]} – ${e.getDate()} ${MGEN[e.getMonth()]}`;
}
const dayLabel=s=>{const t=todayStr();if(s===t)return "Сегодня";if(s===addDays(t,-1))return "Вчера";
  return pd(s).toLocaleDateString("ru-RU",{day:"numeric",month:"long",weekday:"short"})};

/* ================= storage ================= */
const TG=window.Telegram&&window.Telegram.WebApp;
const inTG=!!(TG&&TG.initData);
const hasCloud=inTG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast("6.9");
const CHUNK=3900;

const Local={
  p:"patsy:",
  keys(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(this.p))out.push(k.slice(this.p.length))}}catch(e){}return Promise.resolve(out)},
  getMany(keys){const o={};try{keys.forEach(k=>{o[k]=localStorage.getItem(this.p+k)??""})}catch(e){}return Promise.resolve(o)},
  set(k,v){try{localStorage.setItem(this.p+k,v)}catch(e){return Promise.reject(e)}return Promise.resolve()},
  removeMany(keys){try{keys.forEach(k=>localStorage.removeItem(this.p+k))}catch(e){}return Promise.resolve()}
};
const Cloud={
  keys(){return new Promise((res,rej)=>TG.CloudStorage.getKeys((e,k)=>e?rej(e):res(k||[])))},
  getMany(keys){
    const out={};const batches=[];for(let i=0;i<keys.length;i+=50)batches.push(keys.slice(i,i+50));
    return batches.reduce((p,b)=>p.then(()=>new Promise((res,rej)=>TG.CloudStorage.getItems(b,(e,v)=>{if(e)return rej(e);Object.assign(out,v||{});res()}))),Promise.resolve()).then(()=>out);
  },
  set(k,v){return new Promise((res,rej)=>TG.CloudStorage.setItem(k,v,(e,ok)=>e||!ok?rej(e||"not_saved"):res()))},
  removeMany(keys){if(!keys.length)return Promise.resolve();return new Promise((res,rej)=>TG.CloudStorage.removeItems(keys,(e)=>e?rej(e):res()))}
};
const Store=hasCloud?Cloud:Local;

// Blobs: key prefix P stored as P_0 = "<count>|<data part>", P_1.. = parts
const chunkCount={};
function encodeBlob(str){const parts=[];for(let i=0;i<str.length;i+=CHUNK)parts.push(str.slice(i,i+CHUNK));if(!parts.length)parts.push("");parts[0]=parts.length+"|"+parts[0];return parts}
async function writeBlob(prefix,obj){
  const parts=encodeBlob(JSON.stringify(obj));
  for(let i=parts.length-1;i>=0;i--)await Store.set(prefix+"_"+i,parts[i]); // part 0 last: it carries the count
  const old=chunkCount[prefix]||0;
  if(old>parts.length){const rm=[];for(let i=parts.length;i<old;i++)rm.push(prefix+"_"+i);await Store.removeMany(rm)}
  chunkCount[prefix]=parts.length;
}
function decodeBlobs(map){
  const groups={};
  Object.keys(map).forEach(k=>{const m=k.match(/^(.+)_(\d+)$/);if(!m)return;(groups[m[1]]=groups[m[1]]||{})[+m[2]]=map[k]});
  const out={};
  Object.keys(groups).forEach(p=>{
    const g=groups[p];if(g[0]==null)return;
    const bar=g[0].indexOf("|");if(bar<0)return;
    const n=+g[0].slice(0,bar);let s=g[0].slice(bar+1);
    for(let i=1;i<n;i++){if(g[i]==null){s=null;break}s+=g[i]}
    chunkCount[p]=Math.max(n,Object.keys(g).length);
    if(s==null)return;
    try{out[p]=JSON.parse(s)}catch(e){}
  });
  return out;
}

/* ================= model ================= */
const DEFAULT_CFG=()=>({
  v:1,
  accounts:[{id:"card",name:"Карта",start:0},{id:"cash",name:"Наличные",start:0},{id:"save",name:"Накопления",start:0}],
  exp:["Продукты","Кафе и рестораны","Транспорт","Дом и ЖКХ","Здоровье","Одежда","Красота","Развлечения","Подписки","Подарки","Другое"].map((n,i)=>({id:"e"+i,name:n,color:PALETTE[i%12]})),
  inc:["Зарплата","Подработка","Кэшбэк и проценты","Подарки","Другое"].map((n,i)=>({id:"i"+i,name:n,color:PALETTE[(i+3)%12]})),
  mode:"month",
  budget:{month:{total:0,cats:{}},week:{total:0,cats:{}}}
});
let cfg=null;
let months={};   // "YYYYMM" -> [tx...] ; tx = {id,date,type,amount,cat,acc,to,note}
let view="home", opsFilter="all", ready=false;
let pStart=null;

// compact encoding per month: [id, day, t(e|i|t), kopecks, cat, acc, to, note]
const T2={exp:"e",inc:"i",tr:"t"}, T1={e:"exp",i:"inc",t:"tr"};
function encMonth(items){return {x:items.map(t=>[t.id,+t.date.slice(8),T2[t.type],Math.round(t.amount*100),t.cat||"",t.acc,t.to||"",t.note||""])}}
function decMonth(key,body){const y=key.slice(1,5),m=key.slice(5,7);return (body&&body.x||[]).map(r=>({id:r[0],date:`${y}-${m}-${pad(r[1])}`,type:T1[r[2]]||"exp",amount:r[3]/100,cat:r[4]||"",acc:r[5],to:r[6]||"",note:r[7]||""}))}
const mkey=date=>"m"+date.slice(0,4)+date.slice(5,7);

let chain=Promise.resolve(), pending=0;
function queue(fn){pending++;setStatus();chain=chain.then(fn).then(()=>{pending--;setStatus()},e=>{pending--;console.error(e);setStatus("Не удалось сохранить. Проверьте интернет — данные остались на телефоне, попробуйте ещё раз.","err")});return chain}
function cacheLocal(){if(!hasCloud)return;try{localStorage.setItem("patsy-cache",JSON.stringify({cfg,months}))}catch(e){}}
function saveMonth(k){cacheLocal();const body=encMonth(months[k]||[]);return queue(async()=>{if((months[k]||[]).length)await writeBlob(k,body);else{const n=chunkCount[k]||1;const rm=[];for(let i=0;i<n;i++)rm.push(k+"_"+i);await Store.removeMany(rm);chunkCount[k]=0}})}
function saveCfg(){cacheLocal();const c=JSON.parse(JSON.stringify(cfg));return queue(()=>writeBlob("cfg",c))}

function setStatus(msg,cls){
  const s=$("#status");
  if(msg){s.textContent=msg;s.className="status "+(cls||"");return}
  if(!ready)return;
  if(pending){s.textContent="Сохраняю…";s.className="status";return}
  if(hasCloud){s.textContent="Сохранено в облаке Telegram";s.className="status ok"}
  else{s.textContent=inTG?"Telegram устарел — данные только на этом устройстве":"Открыто вне Telegram — данные только в этом браузере";s.className="status local"}
}

async function boot(){
  if(TG){try{TG.ready();TG.expand();applyTheme();TG.onEvent("themeChanged",applyTheme);TG.BackButton.onClick(onBack)}catch(e){}}
  else applyTheme();
  try{
    const keys=await Store.keys();
    const vals=await Store.getMany(keys.filter(k=>/^(cfg|m\d{6})_\d+$/.test(k)));
    const blobs=decodeBlobs(vals);
    cfg=blobs.cfg||null;
    months={};Object.keys(blobs).forEach(k=>{if(/^m\d{6}$/.test(k))months[k]=decMonth(k,blobs[k])});
    if(!cfg){cfg=DEFAULT_CFG();saveCfg()}
  }catch(e){
    console.error(e);
    let c=null;try{c=JSON.parse(localStorage.getItem("patsy-cache")||"null")}catch(_){}
    cfg=c&&c.cfg||DEFAULT_CFG();months=c&&c.months||{};
    setStatus("Облако Telegram не ответило — показаны сохранённые на телефоне данные.","err");
  }
  normalizeCfg();
  pStart=periodStart(cfg.mode,todayStr());
  ready=true;$("#fab").disabled=false;
  if(!/не ответило/.test($("#status").textContent))setStatus();
  render();
}
function normalizeCfg(){
  const d=DEFAULT_CFG();
  cfg.mode=cfg.mode==="week"?"week":"month";
  cfg.budget=cfg.budget||d.budget;
  ["month","week"].forEach(m=>{cfg.budget[m]=cfg.budget[m]||{total:0,cats:{}};cfg.budget[m].cats=cfg.budget[m].cats||{}});
  ["accounts","exp","inc"].forEach(k=>{if(!Array.isArray(cfg[k])||!cfg[k].length)cfg[k]=d[k]});
}

function applyTheme(){
  const root=document.documentElement;
  let dark=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
  if(inTG&&TG.colorScheme)dark=TG.colorScheme==="dark";
  root.dataset.theme=dark?"dark":"light";
  const tp=TG&&TG.themeParams||{};
  if(tp.secondary_bg_color)root.style.setProperty("--bg",tp.secondary_bg_color);
  if(tp.bg_color){root.style.setProperty("--surface",tp.bg_color)}
  if(tp.text_color)root.style.setProperty("--ink",tp.text_color);
  if(tp.hint_color)root.style.setProperty("--ink-3",tp.hint_color);
  try{if(TG&&TG.isVersionAtLeast("6.1")){const bg=getComputedStyle(root).getPropertyValue("--bg").trim();TG.setHeaderColor(bg);TG.setBackgroundColor(bg)}}catch(e){}
}
const haptic=t=>{try{TG&&TG.HapticFeedback&&(t==="ok"?TG.HapticFeedback.notificationOccurred("success"):TG.HapticFeedback.impactOccurred("light"))}catch(e){}};
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ================= derived ================= */
const allTx=()=>Object.values(months).flat();
function txIn(start,end){
  const out=[];let k=mkey(start);const last=mkey(addDays(end,-1));
  const keys=[k];if(last!==k)keys.push(last);
  keys.forEach(k=>(months[k]||[]).forEach(t=>{if(t.date>=start&&t.date<end)out.push(t)}));
  return out;
}
const catList=t=>t==="inc"?cfg.inc:cfg.exp;
function catOf(tx){return (catList(tx.type)||[]).find(c=>c.id===tx.cat)||{id:tx.cat,name:"Без категории",color:"#8C938D"}}
const accName=id=>{const a=cfg.accounts.find(a=>a.id===id);return a?a.name:"Удалённый счёт"};
function balances(){
  const b={};cfg.accounts.forEach(a=>b[a.id]=+a.start||0);
  allTx().forEach(t=>{
    if(t.type==="exp"&&t.acc in b)b[t.acc]-=t.amount;
    else if(t.type==="inc"&&t.acc in b)b[t.acc]+=t.amount;
    else if(t.type==="tr"){if(t.acc in b)b[t.acc]-=t.amount;if(t.to in b)b[t.to]+=t.amount}
  });return b;
}
function totals(items){let inc=0,exp=0;items.forEach(t=>{if(t.type==="inc")inc+=t.amount;else if(t.type==="exp")exp+=t.amount});return {inc,exp}}
const sorted=items=>items.slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
const curRange=()=>({start:pStart,end:periodEnd(cfg.mode,pStart)});
function daysLeft(start,end){const t=todayStr();if(t>=end)return 0;if(t<start)return daysBetween(start,end);return daysBetween(t,end)}
const meterColor=r=>r>1?"var(--warn)":r>.85?"var(--mid)":"var(--ok)";

/* ================= render ================= */
function txRow(t){
  let title,sub,cls,sign,color,letter;
  if(t.type==="tr"){title="Перевод";sub=accName(t.acc)+" → "+accName(t.to);cls="tr";color="var(--ink-3)";letter="⇄"}
  else{const c=catOf(t);title=c.name;sub=accName(t.acc);cls=t.type;sign=t.type==="inc"?1:-1;color=c.color;letter=c.name.slice(0,1)}
  if(t.note)sub=t.note+" · "+sub;
  const amt=t.type==="tr"?rub(t.amount):rub(sign*t.amount,true);
  return `<button class="tx" data-edit="${esc(t.id)}"><span class="dot" style="background:${esc(color)}">${esc(letter)}</span><span class="mid"><b>${esc(title)}</b><span>${esc(sub)}</span></span><span class="amt num ${cls}">${amt}</span></button>`;
}
const emptyBox=(t,x)=>`<div class="list"><div class="empty"><b>${t}</b>${x}</div></div>`;
const pWord=()=>cfg.mode==="week"?"неделю":"месяц";

function renderHome(){
  const {start,end}=curRange();const items=txIn(start,end);const {inc,exp}=totals(items);
  const bud=cfg.budget[cfg.mode];const limit=+bud.total||0;
  const bal=balances();const total=Object.values(bal).reduce((s,v)=>s+v,0);
  let hero;
  if(limit>0){
    const left=limit-exp, ratio=exp/limit, dl=daysLeft(start,end);
    const elapsed=Math.min(1,Math.max(0,daysBetween(start,todayStr())/daysBetween(start,end)));
    const isCur=todayStr()>=start&&todayStr()<end;
    hero=`<div class="hero">
      <div><div class="lbl">${left>=0?"Осталось в бюджете":"Перерасход"} на ${pWord()}</div>
        <div class="big num ${left<0?"over":""}">${esc(nf.format(Math.abs(Math.round(left))))}<small>₽</small></div></div>
      <div class="meter" title="Потрачено ${Math.round(ratio*100)}%"><i style="width:${Math.min(100,ratio*100)}%;background:${meterColor(ratio)}"></i>${isCur?`<b style="left:${elapsed*100}%" title="Сегодня"></b>`:""}</div>
      <div class="sub num"><span>Потрачено ${rub(exp)} из ${rub(limit)}</span>${dl>0&&left>0?`<span>≈ ${rub(Math.floor(left/dl))} в день · ${dl} дн.</span>`:""}</div>
      <div class="flow num"><div><span>Доходы</span><b>${rub(inc)}</b></div><div><span>Расходы</span><b>${rub(exp)}</b></div><div><span>На счетах</span><b>${rub(total)}</b></div></div>
    </div>`;
  } else {
    hero=`<div class="hero">
      <div><div class="lbl">Всего на счетах</div><div class="big num">${esc(nf.format(Math.round(total)))}<small>₽</small></div></div>
      <div class="flow num"><div><span>Доходы</span><b>${rub(inc)}</b></div><div><span>Расходы</span><b>${rub(exp)}</b></div><div><span>Итог</span><b>${rub(inc-exp,true)}</b></div></div>
      <button class="cta" data-go="settings" data-anchor="budget">Задать бюджет на ${pWord()}</button>
    </div>`;
  }
  // category budgets
  const byCat={};items.forEach(t=>{if(t.type==="exp")byCat[t.cat]=(byCat[t.cat]||0)+t.amount});
  const lim=Object.entries(bud.cats||{}).filter(([id,v])=>+v>0&&cfg.exp.some(c=>c.id===id));
  const catBlock=lim.length?`<div><h2>Лимиты по категориям</h2><div class="blist">${lim.map(([id,v])=>{
      const c=cfg.exp.find(c=>c.id===id);const s=byCat[id]||0;const r=s/v;
      return `<div class="brow"><div class="t"><span>${esc(c.name)}</span><span class="num ${s>v?"neg":""}">${rub(s)} / ${rub(+v)}</span></div><div class="bar"><i style="width:${Math.min(100,r*100)}%;background:${meterColor(r)}"></i></div></div>`}).join("")}</div></div>`:"";
  const recent=sorted(items).slice(0,5);
  $("#v-home").innerHTML=hero+catBlock+`
    <div><h2>Счета</h2><div class="accs">${cfg.accounts.map(a=>`<div class="acc"><span>${esc(a.name)}</span><b class="num ${bal[a.id]<0?"neg":""}">${rub(bal[a.id])}</b></div>`).join("")}</div></div>
    <div><div class="row-h"><h2>Последние операции</h2>${recent.length?`<button class="link" data-go="ops">Все</button>`:""}</div>
      ${recent.length?`<div class="list">${recent.map(txRow).join("")}</div>`:emptyBox("Пока пусто","Нажмите «+», чтобы записать первый расход или доход.")}</div>`;
}

function renderOps(){
  const {start,end}=curRange();
  let items=sorted(txIn(start,end));if(opsFilter!=="all")items=items.filter(t=>t.type===opsFilter);
  const groups=[];items.forEach(t=>{const g=groups[groups.length-1];if(g&&g.date===t.date)g.items.push(t);else groups.push({date:t.date,items:[t]})});
  const f=[["all","Все"],["exp","Расходы"],["inc","Доходы"],["tr","Переводы"]];
  $("#v-ops").innerHTML=`<div class="chips">${f.map(([k,n])=>`<button class="chip" data-filter="${k}" aria-pressed="${opsFilter===k}">${n}</button>`).join("")}</div>`+
    (groups.length?groups.map(g=>{const net=g.items.reduce((s,t)=>s+(t.type==="inc"?t.amount:t.type==="exp"?-t.amount:0),0);
      return `<div><div class="day"><span>${esc(dayLabel(g.date))}</span><span class="num">${net?rub(net,true):""}</span></div><div class="list">${g.items.map(txRow).join("")}</div></div>`}).join("")
    :emptyBox("Нет операций","За этот период ничего не записано."));
}

function renderStats(){
  const {start,end}=curRange();const items=txIn(start,end).filter(t=>t.type==="exp");
  const by={};items.forEach(t=>{const c=catOf(t);by[c.id]=by[c.id]||{name:c.name,color:c.color,sum:0};by[c.id].sum+=t.amount});
  const rows=Object.values(by).sort((a,b)=>b.sum-a.sum);const total=rows.reduce((s,r)=>s+r.sum,0);
  let off=0;const arcs=rows.map(r=>{const len=r.sum/total*100;const s=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="${esc(r.color)}" stroke-width="6" stroke-dasharray="${Math.max(len-.6,.01)} 100" stroke-dashoffset="${-off}"/>`;off+=len;return s}).join("");
  const donut=total?`<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 42 42"><circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--surface-2)" stroke-width="6"/>${arcs}</svg>
      <div class="c"><div><b class="num">${esc(short(total))} ₽</b><span>расходы</span></div></div></div>
      <div class="legend">${rows.map(r=>`<div class="lg"><span class="sw" style="background:${esc(r.color)}"></span><span>${esc(r.name)}<em>${Math.round(r.sum/total*100)}%</em></span><b class="num">${rub(r.sum)}</b></div>`).join("")}</div></div>`
    :`<div class="empty"><b>Нет расходов</b>Когда появятся расходы за этот период, здесь будет разбивка по категориям.</div>`;
  const ps=[];for(let i=5;i>=0;i--)ps.push(shiftPeriod(cfg.mode,pStart,-i));
  const tots=ps.map(p=>({p,...totals(txIn(p,periodEnd(cfg.mode,p)))}));
  const limit=+cfg.budget[cfg.mode].total||0;
  const max=Math.max(1,limit,...tots.map(t=>Math.max(t.inc,t.exp)));
  const bars=tots.map(t=>`<button class="bcol" data-period="${t.p}" aria-current="${t.p===pStart}" title="${esc(periodLabel(cfg.mode,t.p))}: доходы ${rub(t.inc)}, расходы ${rub(t.exp)}">
      <div class="pair">${limit?`<div class="limit-line" style="bottom:${limit/max*100}%"></div>`:""}<div class="b i" style="height:${t.inc/max*100}%"></div><div class="b e" style="height:${t.exp/max*100}%"></div></div>
      <span>${esc(periodLabel(cfg.mode,t.p,true))}</span></button>`).join("");
  const {inc,exp}=totals(txIn(start,end));
  const days=Math.max(1,todayStr()>=start&&todayStr()<end?daysBetween(start,todayStr())+1:daysBetween(start,end));
  const saveRate=inc>0?Math.round((inc-exp)/inc*100):null;
  $("#v-stats").innerHTML=`
    <div><h2>Расходы по категориям</h2><div class="card">${donut}</div></div>
    <div><h2>Доходы и расходы: последние 6 ${cfg.mode==="week"?"недель":"месяцев"}</h2><div class="card">
      <div class="bars">${bars}</div>
      <div class="keys"><span><i style="background:var(--inc)"></i>Доходы</span><span><i style="background:var(--accent)"></i>Расходы</span>${limit?`<span>┄ бюджет ${esc(short(limit))} ₽</span>`:""}<span style="margin-left:auto">макс. ${esc(short(max))} ₽</span></div>
    </div></div>
    <div class="accs">
      <div class="acc"><span>Средний расход в день</span><b class="num">${rub(exp/days)}</b></div>
      <div class="acc"><span>Отложено от дохода</span><b class="num ${saveRate!==null&&saveRate<0?"neg":""}">${saveRate===null?"—":saveRate+"%"}</b></div>
    </div>`;
}

      ${cfg.accounts.map(a=>`<div class="set-row">
        <input class="inp" id="acc-n-${esc(a.id)}" data-accname="${esc(a.id)}" value="${esc(a.name)}" aria-label="Название счёта" maxlength="30">
        <input class="inp num" id="acc-s-${esc(a.id)}" data-accstart="${esc(a.id)}" value="${esc(a.start||0)}" inputmode="decimal" aria-label="Начальный остаток">
        <button class="icon-btn" data-delacc="${esc(a.id)}" ${used.has(a.id)||cfg.accounts.length<2?"disabled":""} aria-label="Удалить счёт">×</button></div>`).join("")}
      <form class="addrow" id="addAcc"><input class="inp" id="newacc" placeholder="Новый счёт" maxlength="30"><button class="btn ghost">Добавить</button></form>
    </div></div>
    ${catBlock("exp","Категории расходов")}
    ${catBlock("inc","Категории доходов")}
    <div><h2>Резервная копия</h2><div class="card stack">
      <div class="hint">${hasCloud?"Данные хранятся в облаке Telegram и доступны в этом боте на всех ваших устройствах.":"Сейчас данные хранятся только в этом браузере."} Всего операций: ${allTx().length}. Копию можно сохранить себе в «Избранное» в Telegram.</div>
      <button class="btn ghost" id="bkCopy">Скопировать резервную копию</button>
      <textarea class="inp" id="bkText" placeholder="Вставьте сюда резервную копию, чтобы восстановить данные" aria-label="Резервная копия"></textarea>
      <button class="btn danger" id="bkRestore">Восстановить из копии</button>
      <div class="err" id="bkErr"></div>
    </div></div>`;
}

function render(){
  if(!cfg)return;
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===cfg.mode));
  $("#pLabel").textContent=periodLabel(cfg.mode,pStart);
  ({home:renderHome,ops:renderOps,stats:renderStats,settings:renderSettings})[view]();
}
function go(v,anchor){
  view=v;document.querySelectorAll("section[data-view]").forEach(s=>s.hidden=s.dataset.view!==v);
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===v));
  window.scrollTo(0,0);render();
  if(anchor){const el=document.getElementById(anchor);if(el)el.scrollIntoView();const i=$("#budTotal");if(i&&anchor==="budget")setTimeout(()=>i.focus(),100)}
}

/* ================= sheet ================= */
let editing=null,fType="exp",fCat=null,delArmed=false;
function openSheet(tx){
  if(!ready)return;
  editing=tx||null;fType=tx?tx.type:"exp";fCat=tx?tx.cat:null;delArmed=false;
  const opts=cfg.accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("");
  $("#fAcc").innerHTML=opts;$("#fTo").innerHTML=opts;
  $("#fAmount").value=tx?String(tx.amount).replace(".",","):"";
  $("#fAcc").value=tx&&cfg.accounts.some(a=>a.id===tx.acc)?tx.acc:cfg.accounts[0].id;
  $("#fTo").value=tx&&tx.to?tx.to:(cfg.accounts[1]||cfg.accounts[0]).id;
  const {start,end}=curRange();const t=todayStr();
  const d=tx?tx.date:(t>=start&&t<end?t:start);
  $("#fDate").value=d;$("#fDate2").value=d;$("#fNote").value=tx&&tx.note||"";
  $("#fErr").textContent="";$("#fDel").hidden=!tx;$("#fDel").textContent="Удалить операцию";
  $("#fSave").textContent=tx?"Сохранить":"Добавить";
  syncType();$("#sheetWrap").hidden=false;
  try{TG&&TG.BackButton.show()}catch(e){}
  if(!tx)setTimeout(()=>$("#fAmount").focus(),60);
}
function closeSheet(){$("#sheetWrap").hidden=true;editing=null;try{TG&&TG.BackButton.hide()}catch(e){}}
function onBack(){if(!$("#sheetWrap").hidden)closeSheet()}
function syncType(){
  document.querySelectorAll("#typeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.type===fType));
  const tr=fType==="tr";
  $("#catField").hidden=tr;$("#toField").hidden=!tr;$("#dateField").hidden=tr;$("#dateField2").hidden=!tr;
  $("#accLbl").textContent=tr?"Со счёта":"Счёт";
  if(!tr){const list=catList(fType);if(!list.some(c=>c.id===fCat))fCat=null;
    $("#fCats").innerHTML=list.map(c=>`<button type="button" class="chip" data-cat="${esc(c.id)}" aria-pressed="${c.id===fCat}"><span class="sw" style="background:${esc(c.color)}"></span>${esc(c.name)}</button>`).join("")}
}
$("#txForm").addEventListener("submit",e=>{
  e.preventDefault();
  const amount=parseAmount($("#fAmount").value);
  if(!(amount>0)){$("#fErr").textContent="Введите сумму больше нуля.";return}
  const tr=fType==="tr";const date=(tr?$("#fDate2"):$("#fDate")).value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){$("#fErr").textContent="Укажите дату.";return}
  if(!tr&&!fCat){$("#fErr").textContent="Выберите категорию.";return}
  if(tr&&$("#fAcc").value===$("#fTo").value){$("#fErr").textContent="Выберите два разных счёта.";return}
  const tx={id:editing?editing.id:uid(),date,type:fType,amount,cat:tr?"":fCat,acc:$("#fAcc").value,to:tr?$("#fTo").value:"",note:$("#fNote").value.trim()};
  const touched=new Set([mkey(date)]);
  if(editing){const ok=mkey(editing.date);months[ok]=(months[ok]||[]).filter(t=>t.id!==editing.id);touched.add(ok)}
  const k=mkey(date);months[k]=(months[k]||[]).concat([tx]);
  touched.forEach(saveMonth);
  const ps=periodStart(cfg.mode,date);if(ps!==pStart){pStart=ps}
  closeSheet();haptic("ok");render();
  // budget warning
  if(tx.type==="exp"){const {start,end}=curRange();const lim=+cfg.budget[cfg.mode].total||0;
    if(lim&&totals(txIn(start,end)).exp>lim)toast("Бюджет на "+pWord()+" превышен");}
});
$("#fDel").addEventListener("click",()=>{
  if(!editing)return;
  if(!delArmed){delArmed=true;$("#fDel").textContent="Нажмите ещё раз, чтобы удалить";return}
  const k=mkey(editing.date);months[k]=(months[k]||[]).filter(t=>t.id!==editing.id);saveMonth(k);closeSheet();haptic();render();
});
$("#fCancel").addEventListener("click",closeSheet);
$("#sheetWrap").addEventListener("click",e=>{if(e.target.id==="sheetWrap")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")onBack()});
$("#typeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){fType=b.dataset.type;syncType()}});
$("#fCats").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(b){fCat=b.dataset.cat;syncType();haptic()}});

/* ================= global events ================= */
$("#fab").addEventListener("click",()=>{haptic();openSheet()});
$("#pPrev").addEventListener("click",()=>{pStart=shiftPeriod(cfg.mode,pStart,-1);render()});
$("#pNext").addEventListener("click",()=>{pStart=shiftPeriod(cfg.mode,pStart,1);render()});
document.querySelector(".mode").addEventListener("click",e=>{const b=e.target.closest("[data-mode]");if(!b||!cfg||b.dataset.mode===cfg.mode)return;
  const t=todayStr();const inCur=t>=pStart&&t<periodEnd(cfg.mode,pStart);
  cfg.mode=b.dataset.mode;budEdit=cfg.mode;pStart=periodStart(cfg.mode,inCur?t:pStart);saveCfg();haptic();render()});
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){haptic();go(b.dataset.tab)}});
$("#app").addEventListener("click",async e=>{
  const t=e.target;
  const ed=t.closest("[data-edit]");if(ed){const tx=allTx().find(x=>x.id===ed.dataset.edit);if(tx)openSheet(tx);return}
  const g=t.closest("[data-go]");if(g){go(g.dataset.go,g.dataset.anchor);return}
  const f=t.closest("[data-filter]");if(f){opsFilter=f.dataset.filter;render();return}
  const p=t.closest("[data-period]");if(p){pStart=p.dataset.period;render();return}
  const be=t.closest("[data-budedit]");if(be){budEdit=be.dataset.budedit;render();return}
  const dc=t.closest("[data-delcat]");if(dc){const [ty,id]=dc.dataset.delcat.split(":");if(cfg[ty].length<2)return;
    cfg[ty]=cfg[ty].filter(c=>c.id!==id);saveCfg();render();return}
  const da=t.closest("[data-delacc]");if(da&&!da.disabled){cfg.accounts=cfg.accounts.filter(a=>a.id!==da.dataset.delacc);saveCfg();render();return}
  if(t.id==="bkCopy"){
    const data=JSON.stringify({patsy:1,cfg,tx:allTx()});
    const ta=$("#bkText");
    try{await navigator.clipboard.writeText(data);toast("Копия скопирована — вставьте её в «Избранное»")}
    catch(err){ta.value=data;ta.focus();ta.select();toast("Выделите текст в поле и скопируйте")}
    return;
  }
  if(t.id==="bkRestore"){
    const err=$("#bkErr");err.textContent="";
    let d;try{d=JSON.parse($("#bkText").value)}catch(_){err.textContent="Это не похоже на резервную копию Patsy.";return}
    if(!d||d.patsy!==1||!d.cfg||!Array.isArray(d.tx)){err.textContent="Это не похоже на резервную копию Patsy.";return}
    if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="Все текущие данные заменятся. Нажмите ещё раз";return}
    const oldKeys=Object.keys(months);
    cfg=d.cfg;normalizeCfg();months={};
    d.tx.forEach(x=>{if(x&&x.id&&x.date&&x.amount>0){const k=mkey(x.date);(months[k]=months[k]||[]).push(x)}});
    new Set([...oldKeys,...Object.keys(months)]).forEach(saveMonth);saveCfg();
    pStart=periodStart(cfg.mode,todayStr());toast("Данные восстановлены");go("home");
  }
});
$("#app").addEventListener("submit",e=>{
  const f=e.target;e.preventDefault();
  if(f.id==="addAcc"){const n=$("#newacc").value.trim();if(!n)return;cfg.accounts.push({id:"a"+uid(),name:n,start:0});saveCfg();render();return}
  if(f.dataset.addcat){const ty=f.dataset.addcat;const n=$("#newcat-"+ty).value.trim();if(!n)return;
    if(cfg[ty].some(c=>c.name.toLowerCase()===n.toLowerCase()))return;
    const used=new Set(cfg[ty].map(c=>c.color));const color=PALETTE.find(c=>!used.has(c))||PALETTE[cfg[ty].length%12];
    cfg[ty].push({id:ty[0]+uid(),name:n,color});saveCfg();render()}
});
$("#app").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.accname!==undefined){const a=cfg.accounts.find(a=>a.id===t.dataset.accname);const n=t.value.trim();if(a&&n&&n!==a.name){a.name=n;saveCfg()}}
  if(t.dataset.accstart!==undefined){const a=cfg.accounts.find(a=>a.id===t.dataset.accstart);const v=t.value.trim()===""?0:parseAmount(t.value);if(a&&isFinite(v)&&v!==a.start){a.start=v;saveCfg()}}
  if(t.dataset.budtotal!==undefined){const v=t.value.trim()===""?0:parseAmount(t.value);if(isFinite(v)&&v>=0){cfg.budget[budEdit].total=v;saveCfg()}}
  if(t.dataset.budcat!==undefined){const v=t.value.trim()===""?0:parseAmount(t.value);if(isFinite(v)&&v>=0){if(v)cfg.budget[budEdit].cats[t.dataset.budcat]=v;else delete cfg.budget[budEdit].cats[t.dataset.budcat];saveCfg()}}
});

boot();
})();
</script>
</body>
</html>
